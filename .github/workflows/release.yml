name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, '/')
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Verify tag is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: git merge-base --is-ancestor "$(git rev-list -n 1 "$TAG")" origin/main

      - name: Test
        run: |
          xcodebuild test \
            -project ClipFetch.xcodeproj \
            -scheme ClipFetch \
            -destination 'platform=macOS'

      - name: Archive universal app
        run: |
          xcodebuild archive \
            -project ClipFetch.xcodeproj \
            -scheme ClipFetch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/ClipFetch.xcarchive" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=-

      - name: Create DMG
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/package" dist
          cp -R "$RUNNER_TEMP/ClipFetch.xcarchive/Products/Applications/ClipFetch.app" "$RUNNER_TEMP/package/"
          hdiutil create \
            -volname ClipFetch \
            -srcfolder "$RUNNER_TEMP/package" \
            -ov \
            -format UDZO \
            "dist/ClipFetch-${TAG}-unsigned.dmg"

      - name: Create upgrade package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          pkgbuild \
            --component "$RUNNER_TEMP/ClipFetch.xcarchive/Products/Applications/ClipFetch.app" \
            --install-location /Applications \
            --identifier com.coletangsy.ClipFetch \
            --version "${TAG#v}" \
            "dist/ClipFetch-${TAG}-unsigned.pkg"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            "dist/ClipFetch-${TAG}-unsigned.dmg" \
            "dist/ClipFetch-${TAG}-unsigned.pkg" \
            --clobber
